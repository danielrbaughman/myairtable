[project]
name = "myairtable"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"dateparser>=1.2.2",
	"dotenv>=0.9.9",
	"fastmcp>=3.2.0",
	"httpx>=0.28.1",
	"mermaid-cli>=0.1.2",
	"pyairtable>=3.2.0",
	"pydantic>=2.11.7",
	"pyperclip>=1.11.0",
	"pytest>=9.0.2",
	"typer>=0.16.1",
	"typer-verbose>=0.1.2",
	"typing-extensions>=4.12.0",
]

# Minimal build backend: src-layout only resolves once the project is installed
# (without it uv treats this as a virtual project and src/ never lands on
# sys.path). Full packaging metadata — license, authors, classifiers, extras,
# entry points — lands in myairtable-d2mh.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myairtable"]

[tool.ruff]
line-length = 150
extend-exclude = ["output"]

[tool.ruff.lint]
extend-select = ["I", "N"]
ignore = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["myairtable"]

[tool.ruff.format]
skip-magic-trailing-comma = false

[[tool.ty.overrides]]
include = ["playground.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["src/myairtable/meta.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore" # ty lacks type stubs for csv module
unresolved-attribute = "ignore" # ty lacks type stubs for csv module

[tool.pytest.ini_options]
# "." is transitional: static/ is still at the repo root and tests import
# static.python.airtable_runtime. Drops to ["src"] once static/ moves into the
# package (myairtable-1mcd).
pythonpath = ["src", "."]

[dependency-groups]
dev = [
	"ruff>=0.15.18",
	"ty>=0.0.51"
]
