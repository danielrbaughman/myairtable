name: Release

# Publishes to PyPI via a trusted publisher (OIDC) — no API token is stored anywhere.
# PyPI verifies the request came from this repo, this workflow file, and the `pypi`
# environment; the configuration on PyPI's side must match all three or it rejects the
# upload. Renaming this file or the environment therefore breaks publishing until the
# trusted publisher is updated to match.
#
# To cut a release:
#   1. bump `version` in pyproject.toml   (rc first: 0.1.0rc1 — see myairtable-8oig)
#   2. merge it to main
#
# That's it — the version bump IS the release trigger. On every push to main this
# workflow builds and smoke-tests the wheel; the `publish` job only runs when
# pyproject.toml's version is not already on PyPI, so ordinary commits (docs, code
# with no bump) build-and-verify but publish nothing, and a bump ships. A PyPI
# version can never be reused or truly unpublished, so the smoke test runs BEFORE the
# upload, not after. Never yank; roll forward.
#
# workflow_dispatch is a safe rehearsal: it builds and verifies but never publishes
# (publish is gated on `push`), so you can exercise this file without shipping.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify the artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_new: ${{ steps.ver.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Resolve version and check whether it is already on PyPI
        id: ver
        run: |
          version="$(uv run --no-project python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # PyPI returns 200 for an existing version, 404 otherwise. A version can
          # never be re-uploaded, so if it already exists we must NOT try to publish.
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/myairtable/$version/json")"
          if [ "$code" = "200" ]; then
            echo "v$version is already on PyPI — nothing to publish."
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is not on PyPI yet (HTTP $code) — will publish."
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      # The package is a code generator whose static templates live inside the wheel;
      # Phase 0/1b bugs (paths resolved from cwd, static/ left out of the build) are
      # invisible in the repo and only show up from an installed wheel elsewhere.
      - name: Smoke test the built wheel outside the repo
        run: |
          set -e
          uv venv /tmp/v
          uv pip install --python /tmp/v/bin/python "$(echo dist/*.whl)[cli]"
          cd /tmp
          /tmp/v/bin/python - <<'PY'
          import pathlib

          import myairtable
          from myairtable import schema_tools

          pkg = pathlib.Path(myairtable.__file__).parent
          static = pkg / "static"
          assert static.is_dir(), f"static/ missing from the wheel: {static}"
          assert any(static.iterdir()), "static/ is present but empty"
          assert len(schema_tools.PUBLIC_TOOLS) == 28, f"expected 28 public tools, got {len(schema_tools.PUBLIC_TOOLS)}"
          print("import OK:", myairtable.__file__)
          PY
          /tmp/v/bin/myairtable --help > /dev/null
          echo "entry point OK"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    # Only a push to main that carries a new version publishes. workflow_dispatch stops
    # here (rehearsal), and a push whose version is already on PyPI skips the upload.
    # Gating on the `pypi` environment applies its protection rules and the trusted
    # publisher.
    if: github.event_name == 'push' && needs.verify.outputs.is_new == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/myairtable
    permissions:
      id-token: write # mints the OIDC token PyPI checks; the whole point of trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Belt-and-suspenders: if the PyPI reachability check in `verify` ever
          # misfires, don't hard-fail on an already-uploaded version — just skip it.
          skip-existing: true

  tag:
    name: Tag the published release
    needs: [verify, publish]
    if: github.event_name == 'push' && needs.verify.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and push the vX tag + GitHub release
    steps:
      - uses: actions/checkout@v4

      - name: Create v-tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.verify.outputs.version }}"
          # Idempotent: skip if the tag somehow already exists.
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists — skipping."
            exit 0
          fi
          gh release create "v$version" --title "v$version" --generate-notes --target "$GITHUB_SHA"
